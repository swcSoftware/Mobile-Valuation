name: ValueLens
options:
  bundleIdPrefix: com.swcsoftware
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ValueLens:
    type: application
    platform: iOS
    sources:
      - path: ValueLens
    dependencies:
      - framework: ../../packages/valuation-core/build/XCFrameworks/release/ValuationCore.xcframework
        embed: false
    preBuildScripts:
      - name: Build ValuationCore.xcframework if missing
        script: |
          set -e
          FW="$SRCROOT/../../packages/valuation-core/build/XCFrameworks/release/ValuationCore.xcframework"
          if [ ! -d "$FW" ]; then
            cd "$SRCROOT/../android"
            export JAVA_HOME="${JAVA_HOME:-/Applications/Android Studio.app/Contents/jbr/Contents/Home}"
            ./gradlew :valuation-core:assembleValuationCoreReleaseXCFramework -q
          fi
        basedOnDependencyAnalysis: false
    info:
      path: ValueLens/Info.plist
      properties:
        CFBundleDisplayName: ValueLens
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.swcsoftware.valuelens
            CFBundleURLSchemes: [valuelens]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swcsoftware.valuelens
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        SWIFT_STRICT_CONCURRENCY: minimal
  ValueLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ValueLensTests
    dependencies:
      - target: ValueLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swcsoftware.valuelens.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  ValueLens:
    build:
      targets:
        ValueLens: all
        ValueLensTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ValueLensTests]
