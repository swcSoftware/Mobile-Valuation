<html lang="en">
<head>

<title>Report Card</title>

<x-dc>
<helmet>

<style>
body { margin: 0; font-family: "Public Sans", "Helvetica Neue", sans-serif; background: #F1F4F5; color: #14181B; -webkit-font-smoothing: antialiased; }
a { color: #0B7A57; } a:hover { color: #075C41; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #0B7A57; outline-offset: 2px; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F1F4F5; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 18px 18px 12px; display: flex; align-items: flex-start; gap: 10px;">
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.12; letter-spacing: -0.015em; text-wrap: balance;">{{name}}</div>
      <div style="font-size: 11px; color: #5D6B70; margin-top: 3px;">{{tkr}} &middot; {{mode}} &middot; priced {{asOf}}</div>
    </div>
    <span style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; white-space: nowrap; background: {{chipBg}}; color: {{chipFg}};">{{chipLabel}}</span>
  </div>

  <div style="margin: 0 18px; background: #FFFFFF; border: 1px solid #DFE5E7; border-radius: 14px; padding: 16px;">
    <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A878B;">{{modelLabel}}</div>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 17.5px; line-height: 1.28; letter-spacing: -0.01em; margin-top: 8px; text-wrap: balance;">{{headline}}</div>
    <div style="display: flex; gap: 20px; margin-top: 16px;">
      <div>
        <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9A6006;">You pay</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 25px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #9A6006; margin-top: 2px;">{{priceStr}}</div>
      </div>
      <div>
        <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #0B7A57;">It&rsquo;s worth</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 25px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #0B7A57; margin-top: 2px;">{{ivStr}}</div>
      </div>
    </div>
    <div style="position: relative; height: 8px; border-radius: 4px; background: #EAEFF0; margin-top: 14px;">
      <div style="position: absolute; top: 0; bottom: 0; border-radius: 4px; background: #B9E3D2; left: 0; width: {{ivWidth}}%;"></div>
      <div style="position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px; background: #9A6006; left: {{priceLeft}}%;"></div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 9px;">
      <span style="font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{chipFg}};">{{mosStr}}</span>
      <span style="font-size: 11px; color: #5D6B70;">{{mosCaption}}</span>
    </div>
  </div>

  <div style="padding: 18px 18px 0;">
    <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7A878B;">Business health, graded</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 9px;">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border: 1px solid #DFE5E7; border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 5px;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; width: 25px; height: 25px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: {{f.gradeBg}}; color: {{f.gradeFg}};">{{f.grade}}</span>
            <span style="font-size: 11px; font-weight: 600; line-height: 1.2;">{{f.l}}</span>
          </div>
          <div style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #14181B;">{{f.v}}</div>
          <div style="font-size: 9.5px; line-height: 1.4; color: #6B787D;">{{f.sub}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 14px 18px 0; flex-grow: 1;">
    <button onClick="{{toggleNotes}}" style="width: 100%; text-align: left; background: #FFFFFF; border: 1px solid #DFE5E7; border-radius: 12px; padding: 12px; min-height: 44px;" aria-label="Show the data checks that need a look">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; font-weight: 600; flex-grow: 1;">{{checkHeadline}}</span>
        <span style="font-size: 11px; font-weight: 600; color: #0B7A57;">{{notesCaret}}</span>
      </div>
      <div style="display: flex; gap: 2px; margin-top: 9px;">
        <sc-for list="{{checks}}" as="k" hint-placeholder-count="16">
          <span style="flex-grow: 1; height: 5px; border-radius: 2px; background: {{k.color}};"></span>
        </sc-for>
      </div>
      <sc-if value="{{notesOpen}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 11px;">
          <sc-for list="{{notes}}" as="n" hint-placeholder-count="2">
            <div style="font-size: 10.5px; line-height: 1.45; color: #5D6B70; padding-left: 9px; border-left: 2px solid #F0C05A;">{{n.text}}</div>
          </sc-for>
        </div>
      </sc-if>
    </button>
    <div style="display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 11px;">
      <sc-for list="{{prov}}" as="p" hint-placeholder-count="4">
        <span style="font-size: 9.5px; color: {{p.color}};">{{p.text}}</span>
      </sc-for>
    </div>
  </div>

  <div style="padding: 10px 18px 20px; border-top: 1px solid #DFE5E7; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; gap: 6px;">
      <sc-for list="{{models}}" as="m" hint-placeholder-count="2">
        <button onClick="{{m.pick}}" style="flex-grow: 1; font-size: 11px; font-weight: 600; min-height: 38px; border-radius: 9px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: {{m.fg}};">{{m.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 4px; flex-wrap: wrap;">
      <sc-for list="{{tickers}}" as="k" hint-placeholder-count="9">
        <button onClick="{{k.pick}}" style="font-size: 10.5px; font-weight: 600; padding: 0 8px; min-height: 36px; border-radius: 8px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}};">{{k.t}}</button>
      </sc-for>
    </div>
  </div>

</div>
