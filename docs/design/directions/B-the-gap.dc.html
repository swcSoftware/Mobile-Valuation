<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; background: #0B0B0C; color: #EDEDEE; -webkit-font-smoothing: antialiased; }
a { color: #2ED99E; } a:hover { color: #6BE8BD; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid #2ED99E; outline-offset: 2px; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0C; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 18px 20px 14px; display: flex; align-items: baseline; gap: 9px; border-bottom: 1px solid #1E1E21;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px; letter-spacing: 0.04em;">{{tkr}}</span>
    <span style="font-size: 11px; color: #83838C; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{name}}</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: #9A9AA3;">{{mode}}</span>
  </div>

  <div style="padding: 18px 20px 4px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #6A6A73;">{{readingLabel}}</div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 6px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: {{tone}};">{{gapStr}}</span>
      <span style="font-size: 11.5px; line-height: 1.35; color: #9A9AA3; max-width: 150px;">{{gapCaption}}</span>
    </div>
  </div>

  <div style="padding: 14px 20px 0; position: relative; height: 352px; box-sizing: border-box;">

      <sc-for list="{{ticks}}" as="k" hint-placeholder-count="5">
        <div style="position: absolute; left: 0; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-variant-numeric: tabular-nums; color: #55555D; transform: translateY(50%); bottom: {{k.pos}}%;">{{k.label}}</div>
      </sc-for>

      <div style="position: absolute; left: 56px; right: 0; top: 0; bottom: 0; border-left: 1px solid #2A2A2F;"></div>

      <sc-if value="{{hasGap}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; left: 56px; width: 62px; background: {{gapFill}}; border-top: 1px solid {{gapEdge}}; border-bottom: 1px solid {{gapEdge}}; bottom: {{gapBottom}}%; height: {{gapHeight}}%;"></div>
      </sc-if>

      <sc-if value="{{hasBands}}" hint-placeholder-val="{{true}}">

            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{hasValue}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; left: 56px; right: 0; bottom: {{valuePos}}%;">
          <div style="height: 2px; background: #2ED99E;"></div>
          <div style="position: absolute; left: 66px; bottom: 5px; display: flex; align-items: baseline; gap: 6px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #2A9E76;">Fair value</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: #2ED99E;">{{ivStr}}</span>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{withheld}}" hint-placeholder-val="{{true}}">
        <div style="position: absolute; left: 56px; right: 0; bottom: 0; height: 46%; border: 1px dashed #3A3A41; border-radius: 4px; box-sizing: border-box; padding: 10px 12px;">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #9A9AA3;">No reading taken</div>
          <div style="font-size: 10.5px; line-height: 1.45; color: #7A7A83; margin-top: 6px;">{{withheldWhy}}</div>
        </div>
      </sc-if>

      <div style="position: absolute; left: 56px; right: 0; bottom: {{pricePos}}%;">
        <div style="height: 2px; background: #F5A623;"></div>
        <div style="position: absolute; left: 66px; top: 5px; display: flex; align-items: baseline; gap: 6px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #C98E21;">Price</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; color: #F5A623;">{{priceStr}}</span>
        </div>
      </div>

    </div>
  </div>

  <div style="padding: 4px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #1E1E21; border: 1px solid #1E1E21; border-radius: 6px; overflow: hidden;">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
      <div style="background: #0F0F11; padding: 10px 11px;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: #6A6A73;">{{s.l}}</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-variant-numeric: tabular-nums; color: #EDEDEE; margin-top: 4px;">{{s.v}}</div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px 20px 0; flex-grow: 1;">
    <button onClick="{{toggleNotes}}" style="width: 100%; text-align: left; min-height: 44px;" aria-label="Show data checks and notes">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #6A6A73; flex-grow: 1;">Instrument check</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #9A9AA3;">{{checkLabel}}</span>
      </div>
      <div style="display: flex; gap: 2px; margin-top: 8px;">
        <sc-for list="{{checks}}" as="k" hint-placeholder-count="16">
          <span style="flex-grow: 1; height: 5px; border-radius: 1px; background: {{k.color}};"></span>
        </sc-for>
      </div>
    </button>
    <sc-if value="{{notesOpen}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px;">
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="2">
          <div style="font-size: 10.5px; line-height: 1.45; color: #83838C; padding-left: 10px; border-left: 1px solid #2A2A2F;">{{n.text}}</div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="padding: 10px 20px 20px; border-top: 1px solid #1E1E21; display: flex; flex-direction: column; gap: 9px;">
    <div style="display: flex; gap: 1px; background: #1E1E21; border-radius: 7px; overflow: hidden;">
      <sc-for list="{{models}}" as="m" hint-placeholder-count="2">
        <button onClick="{{m.pick}}" style="flex-grow: 1; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; min-height: 38px; background: {{m.bg}}; color: {{m.fg}};">{{m.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 4px; flex-wrap: wrap;">
      <sc-for list="{{tickers}}" as="k" hint-placeholder-count="9">
        <button onClick="{{k.pick}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.03em; padding: 0 8px; min-height: 36px; border-radius: 6px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}};">{{k.t}}</button>
      </sc-for>
    </div>
  </div>

</div>
