# fly.io deployment (not yet used — LAN mode chosen for Sprint 1). `fly launch --copy-config` then `fly deploy`.
app = "valuelens-engine"
primary_region = "iad"

[build]

[env]
  CACHE_DB = "/data/edgar.sqlite"
  REQUIRE_IDENTITY = "true"

[mounts]
  source = "engine_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
